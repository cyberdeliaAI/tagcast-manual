[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tagcast-manual"
version = "0.1.0"
description = "Reproducible illustrated PDF editions of the canonical Tagcast Wiki"
requires-python = ">=3.12,<3.13"
dependencies = [
  "reportlab==4.4.9",
  "pillow==13.0.0",
  "markdown-it-py==4.0.0",
  "pypdf==6.21.4",
  "pdfplumber==0.11.9",
  "pypdfium2==5.13.0",
]

[project.scripts]
tagcast-manual = "tagcast_manual.cli:main"

[dependency-groups]
dev = ["ruff==0.14.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/tagcast_manual"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
